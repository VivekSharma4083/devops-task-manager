name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Test and package Java app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests and package JAR
        run: mvn -B --no-transfer-progress verify
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: devops-task-manager-jar
          path: target/devops-task-manager-1.0.0.jar
          if-no-files-found: error

  docker:
    name: Build and smoke test container
    needs: java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: devops-task-manager-jar
          path: target
      - name: Build image
        run: docker build -t devops-task-manager:ci .
      - name: Check health endpoint
        run: |
          docker run -d --name taskmanager-ci -p 8080:8080 devops-task-manager:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs taskmanager-ci
          exit 1

  infrastructure:
    name: Validate deployment files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Check Ansible files
        run: python scripts/verify-ansible.py
      - name: Check Kubernetes manifests
        run: python scripts/verify-k8s.py
