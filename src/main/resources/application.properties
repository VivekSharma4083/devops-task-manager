spring.application.name=devops-task-manager
server.port=8080

# Logging configuration
logging.level.root=INFO
logging.level.com.devops.taskmanager=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Continuous Integration Deployment Trigger
info.app.build.status=ACTIVE
info.app.ci.pipeline=jenkins-automated
